services:
  - title: Aplicaciones web a la medida
    summary: Portales, plataformas internas y sistemas con inicio de sesión corporativo, de la base de datos al despliegue.
    deliverables:
      - Aplicación en producción con pruebas automatizadas
      - Código fuente y documentación de arquitectura
      - Despliegue reproducible y guía de operación
  - title: Datos, dashboards y reportes
    summary: Modelos de datos, ETL y tableros de Power BI que responden preguntas concretas del negocio.
    deliverables:
      - Modelo de datos y consultas SQL documentadas
      - Tablero o reporte con indicadores acordados
      - Proceso de actualización automática
  - title: Automatización e integración con IA
    summary: Bots, extracción de datos de documentos, integraciones entre sistemas y servidores MCP para asistentes de IA.
    deliverables:
      - Automatización funcionando sobre tus sistemas
      - Registro de ejecuciones y manejo de errores
      - Manual de uso y de mantenimiento
  - title: Rescate de sistemas heredados
    summary: Diagnóstico, pruebas y modernización de software que nadie se atreve a tocar, sin detener la operación.
    deliverables:
      - Informe de diagnóstico con riesgos priorizados
      - Suite de pruebas que protege lo que ya funciona
      - Mejoras entregadas por etapas

process:
  - title: Conversación
    description: Me cuentas el problema y el resultado que necesitas. Respondo en menos de 24 horas hábiles.
  - title: Propuesta
    description: Alcance, entregables, plazos y un precio fijo por entregable, por escrito.
  - title: Entregas por etapas
    description: Avances que puedes ver y probar, con demostraciones en cada etapa.
  - title: Cierre y soporte
    description: Código, documentación y acompañamiento para que el sistema siga funcionando.

pricing: Cotización a partir del requerimiento, con precio fijo por entregable.
