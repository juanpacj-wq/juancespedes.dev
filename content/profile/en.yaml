services:
  - title: Custom web applications
    summary: Portals, internal platforms and systems with corporate sign-in, from the database to deployment.
    deliverables:
      - Application in production with automated tests
      - Source code and architecture documentation
      - Reproducible deployment and an operations guide
  - title: Data, dashboards and reports
    summary: Data models, ETL and Power BI dashboards that answer concrete business questions.
    deliverables:
      - Documented data model and SQL queries
      - Dashboard or report with agreed indicators
      - Automatic refresh process
  - title: Automation and AI integration
    summary: Bots, document data extraction, integrations between systems and MCP servers for AI assistants.
    deliverables:
      - Automation running on your systems
      - Execution log and error handling
      - User and maintenance guide
  - title: Legacy system rescue
    summary: Diagnosis, tests and modernization of software nobody dares to touch, without stopping operations.
    deliverables:
      - Diagnosis report with prioritized risks
      - Test suite that protects what already works
      - Improvements delivered in stages

process:
  - title: Conversation
    description: You tell me the problem and the result you need. I reply within one business day.
  - title: Proposal
    description: Scope, deliverables, timeline and a fixed price per deliverable, in writing.
  - title: Staged delivery
    description: Progress you can see and test, with a demo at every stage.
  - title: Handover and support
    description: Code, documentation and support so the system keeps running.

pricing: Quoted from your requirements, with a fixed price per deliverable.
