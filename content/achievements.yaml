  kind: performance
  project: plant-telemetry
  value: { es: '44×', en: '44×' }
  title:
    es: Lecturas de generación 44 veces más rápidas
    en: Generation readings 44 times faster
  summary:
    es: Conecté la telemetría directo a los medidores de las plantas. Cada lectura tarda 25 ms en vez de cerca de 1,1 s, y ya no depende de un sistema central que era un punto único de falla.
    en: I connected the telemetry straight to the plants' meters. Each reading takes 25 ms instead of about 1.1 s, and no longer depends on a central system that was a single point of failure.
