- id: portal-rollbacks
  order: 5
  kind: reliability
  project: corporate-portal
  value: { es: '0 caídas', en: '0 outages' }
  title:
    es: Despliegues que se corrigen solos
    en: Deployments that fix themselves
  summary:
    es: Cada versión del portal se verifica al publicarse y, si algo falla, vuelve sola a la anterior. Pasó 4 veces en producción y el sitio nunca dejó de responder.
    en: Every release of the website is verified as it goes live and, if anything fails, rolls itself back. It happened 4 times in production and the site never stopped responding.
  context: { es: Portal corporativo, en: Corporate website }
  source:
    es: Decisiones de despliegue del caso de estudio del portal, 2026
    en: Deployment decisions in the website case study, 2026

