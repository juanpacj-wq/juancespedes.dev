name: PR title

# Squash merges use the PR title as the commit message, so it must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # The release workflow dispatches this check for the release-please pull request, which is
  # opened with GITHUB_TOKEN and therefore triggers no pull_request workflows (ADR 0013).
  workflow_dispatch:
    inputs:
      title:
        description: Pull request title to check
        required: true

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        env:
          TITLE: ${{ inputs.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9.-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Conventional title: $TITLE"
          else
            echo "::error::Not a Conventional Commits title: $TITLE"
            exit 1
          fi
