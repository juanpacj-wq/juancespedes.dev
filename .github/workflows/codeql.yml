name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched on the release-please branch by the release workflow (ADR 0013).
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning on personal repositories requires the repository to be public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
