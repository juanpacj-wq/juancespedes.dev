name: CI

# Pull requests only. `main` accepts squash merges of branches that are up to date with it and
# passed these checks (ruleset "Protect main", strict status checks), so the tree that lands on
# main is the tree tested here; running the suite again after the merge took 7 minutes and
# checked nothing new (ADR 0024).
on:
  pull_request:
  # The release workflow dispatches CI on the release-please branch: pull requests opened with
  # GITHUB_TOKEN do not trigger workflows, and workflow_dispatch is the exception (ADR 0013).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm arch:check

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          # Internal names the content must never mention (tests/content). Kept as a secret so
          # the public repository does not list them; forks run without it and skip that check.
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
      - name: Coverage summary
        run: |
          echo '### Coverage (domain + application)' >> "$GITHUB_STEP_SUMMARY"
          node -e "const s=require('./coverage/coverage-summary.json').total;for(const k of ['lines','branches','functions','statements'])console.log('- '+k+': '+s[k].pct+' %')" >> "$GITHUB_STEP_SUMMARY"

  # One job per browser: the suite took 4 minutes in a single job, about a third in each.
  e2e-browser:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: mobile
            browser: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local runtime config before building: Cloudflare's documented Turnstile test keys.
      - run: cp .env.example .dev.vars
      - run: pnpm build
        env:
          APP_VERSION: ${{ github.sha }}
      - name: JavaScript and page budgets
        if: matrix.project == 'chromium'
        run: pnpm bundle:check && pnpm pages:check
      # Browsers are cached per Playwright version (from the lockfile); the system libraries they
      # need are not cacheable and are installed on every run.
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Flaky tests
        if: always()
        run: node scripts/flaky-summary.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # The required check keeps its name: it passes when every browser passed.
  e2e:
    name: End-to-end and accessibility
    if: always()
    needs: e2e-browser
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-browser.result }}" = success

  # Two jobs, three pages each (lighthouserc.json): 18 runs took 4 minutes in a single job.
  lighthouse-group:
    name: Lighthouse (pages ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .dev.vars
      - run: pnpm build
      - name: Pages of this group
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('lighthouserc.json', 'utf8'));
            config.ci.collect.url = config.ci.collect.url.filter((_, i) => i % 2 === ${{ matrix.group }});
            console.log(config.ci.collect.url.join('\n'));
            fs.writeFileSync('lighthouserc.group.json', JSON.stringify(config));
          "
      - run: pnpm exec lhci autorun --config=lighthouserc.group.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports-${{ matrix.group }}
          path: .lighthouseci/reports/
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    if: always()
    needs: lighthouse-group
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lighthouse-group.result }}" = success

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the pull request's commits to scan only what changed.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
