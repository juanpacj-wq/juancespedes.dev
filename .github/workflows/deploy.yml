name: Deploy

# Pull requests get a preview version with its own URL; main goes to production.
# Disabled until the repository variable CLOUDFLARE_DEPLOY_ENABLED is set to "true"
# and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist (see docs/runbooks/deploy.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Dependabot runs get no repository secrets by design, so they cannot upload a preview.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          APP_VERSION: ${{ github.sha }}
          # Real Turnstile site key (public by design); without it the test key is used and the
          # production secret rejects every token, so the form fails closed.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          # Page views are counted for production only; previews build without the beacon.
          PUBLIC_WEB_ANALYTICS_TOKEN: ${{ github.event_name == 'push' && vars.PUBLIC_WEB_ANALYTICS_TOKEN || '' }}
          # "Ask me" (ADR 0017): previews always show it (with the free fake model); production
          # shows it only when the repository variable CHAT_ENABLED is "true".
          PUBLIC_CHAT_ENABLED: ${{ github.event_name == 'pull_request' && 'true' || vars.CHAT_ENABLED || 'false' }}
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Previews never call the paid model, even though they share the Worker's secrets.
          command: versions upload --message "PR #${{ github.event.number }} ${{ github.sha }}" --var CHAT_ENABLED:true --var CHAT_MODEL:fake
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview
          message: |
            Preview: ${{ steps.preview.outputs.deployment-url }}
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The chat runs on the real model only when CHAT_ENABLED is "true" (the kill switch) and
          # the ANTHROPIC_API_KEY secret exists; otherwise the endpoint answers "disabled".
          command: deploy --message "main ${{ github.sha }}" --var CHAT_ENABLED:${{ vars.CHAT_ENABLED || 'false' }} --var CHAT_MODEL:anthropic
